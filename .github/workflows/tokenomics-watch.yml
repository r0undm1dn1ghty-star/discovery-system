name: tokenomics-watch

# Еженедельный сбор цен LLM (market-intel/tokenomics-monitor.py).
# market-intel/ в .gitignore — приватная аналитика, в репозиторий не коммитится.
# Отчёт хранится как артефакт 90 дней; сдвиг вендорских цен — уведомление в Telegram.

on:
  schedule:
    - cron: "17 5 * * 1" # понедельник 05:17 UTC = 08:17 МСК
  workflow_dispatch: {} # ручной запуск из вкладки Actions

permissions:
  contents: read

concurrency:
  group: tokenomics-watch
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect live prices
        run: |
          set -euo pipefail
          python market-intel/tokenomics-monitor.py
          ls -la market-intel/

      - name: Price-shift guard (landing constants vs models.dev)
        id: guard
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          from datetime import date

          # Вендорские константы, вшитые в nacenka.html ($/1M; ₽ получаются умножением
          # на курс ЦБ). Меняются только вместе с матрицей — guard напомнит, если рынок уехал.
          EXPECTED = {
              "deepseek":   {"id": "deepseek-flash",   "input": 0.15, "output": 0.60, "cache_read": 0.003},
              "zai":        {"id": "glm-5.2",          "input": 1.40, "output": 4.40, "cache_read": 0.26},
              "moonshotai": {"id": "kimi-k3",          "input": 3.00, "output": 15.00, "cache_read": 0.30},
              "minimax":    {"id": "MiniMax-M3",       "input": 0.30, "output": 1.20, "cache_read": 0.06},
              "anthropic":  {"id": "claude-sonnet-5",  "input": 2.00, "output": 10.00, "cache_read": 0.20},
          }

          req = urllib.request.Request(
              "https://models.dev/api.json",
              headers={"User-Agent": "tokenomics-watch/1.0"},
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              md = json.loads(r.read().decode())

          shifts = []
          for prov, spec in EXPECTED.items():
              m = (md.get(prov) or {}).get("models", {}).get(spec["id"])
              if not m:
                  shifts.append(f"{prov}/{spec['id']}: ИСЧЕЗ ИЗ КАТАЛОГА models.dev")
                  continue
              c = m.get("cost") or {}
              for field in ("input", "output", "cache_read"):
                  label = "cache-read" if field == "cache_read" else field
                  now, exp = c.get(field), spec[field]
                  if now is None:
                      shifts.append(f"{prov}/{spec['id']}: поле {label} пропало")
                  elif abs(now - exp) > 1e-9:
                      pct = (now - exp) / exp * 100
                      shifts.append(f"{prov}/{spec['id']}: {label} ${exp} → ${now} ({pct:+.1f}%)")

          day = date.today().isoformat()
          if shifts:
              body = "Сдвиг вендорских цен — проверь и обнови матрицу nacenka.html:\n" + \
                     "\n".join(f"- {s}" for s in shifts)
              print(body)
              with open("market-intel/price-shift-alert.txt", "w", encoding="utf-8") as f:
                  f.write(f"[{day}]\n{body}\n")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write("alert=1\n")
          else:
              print(f"[{day}] Все вендорские константы на месте — матрица актуальна.")
          PY

      - name: Upload report (90 days)
        uses: actions/upload-artifact@v4
        with:
          name: tokenomics-${{ github.run_id }}
          path: market-intel/
          retention-days: 90
          if-no-files-found: warn

      - name: Notify Telegram on price shift
        if: steps.guard.outputs.alert == '1' && secrets.TELEGRAM_BOT_TOKEN != ''
        run: |
          set -euo pipefail
          TEXT=$(cat market-intel/price-shift-alert.txt)
          curl -sS --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" > /dev/null
          echo "уведомление отправлено"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
