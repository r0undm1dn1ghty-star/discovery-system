<style>
:root{--bg:#0e1220;--panel:#161b30;--line:#232a3f;--ink:#eef1f8;--body:#aab4c8;
--accent:#7bc4ff;--ok:#5ed9a8;--warn:#f0b24a;--steel:#8fa3c8;
--mono:'IBM Plex Mono',ui-monospace,monospace;--sans:'IBM Plex Sans',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--body);font-family:var(--sans);overflow:hidden}
#wrap{display:flex;height:100vh}
#graph{flex:1;min-width:0;background:var(--bg)}
#side{width:310px;flex-shrink:0;border-left:1px solid var(--line);background:var(--panel);
  padding:22px;overflow-y:auto}
h1{color:var(--ink);font-size:1.12rem;font-weight:600;margin-bottom:6px;line-height:1.3}
.sub{font-family:var(--mono);font-size:11.5px;color:var(--steel);letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:20px}
.k{font-family:var(--mono);font-size:11px;color:var(--steel);letter-spacing:.1em;
  text-transform:uppercase;margin:18px 0 8px}
.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);
  font-size:13.5px}
.stat b{color:var(--ink);font-variant-numeric:tabular-nums}
.leg{display:flex;align-items:center;gap:9px;font-size:13px;padding:5px 0}
.dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.dot.box{width:14px;height:10px;border-radius:2px}
.dot.hex{width:11px;height:11px;border-radius:2px;transform:rotate(45deg)}
.dot.ell{border-radius:50%;width:12px;height:12px}
.filter{margin-top:6px}
.filter button{display:block;width:100%;text-align:left;background:rgba(255,255,255,.03);
  border:1px solid var(--line);color:var(--body);font-family:var(--sans);font-size:13px;
  padding:8px 11px;border-radius:8px;margin-bottom:6px;cursor:pointer;min-height:38px;
  transition:background .15s,border-color .15s,color .15s}
.filter button:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.filter button.on{background:rgba(123,196,255,.12);border-color:rgba(123,196,255,.45);color:var(--ink)}
.note{font-size:11.5px;color:var(--steel);line-height:1.5;margin-top:18px;
  padding-top:14px;border-top:1px solid var(--line)}
#tip{position:fixed;pointer-events:none;background:rgba(14,18,32,.97);border:1px solid var(--line);
  border-radius:9px;padding:11px 13px;font-size:12.5px;color:var(--body);max-width:340px;
  display:none;z-index:20;line-height:1.5;box-shadow:0 8px 28px rgba(0,0,0,.5)}
#tip a{color:var(--accent)}
#hint{position:absolute;bottom:16px;left:18px;font-family:var(--mono);font-size:11px;
  color:var(--steel);opacity:.65}
@media(max-width:820px){
  #wrap{flex-direction:column}
  #side{width:100%;height:44vh;border-left:none;border-top:1px solid var(--line)}
  #graph{height:56vh}
}
</style>
</head>
<body>
<div id="wrap">
<div id="graph"></div>
<div id="side">
  <h1>Граф сигналов</h1>
  <p class="sub">Discovery System</p>

  <div class="stat"><span>тем</span><b id="st-top"></b></div>
  <div class="k">типы</div>
  <div id="types"></div>

  <div class="k">фильтр по типу</div>
  <div class="filter" id="filter"></div>
  <p class="note">Клик по сигналу — источник и ссылка. Крутите колесом, тяните узлы.
  Граф собирается автоматически из ленты на этой странице.</p>
</div>
</div>
<div id="tip"></div>
<div id="hint">клик — раскрыть · двойной клик — оставить один</div>
